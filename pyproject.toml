[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantasy-basketball-mcp"
version = "0.1.0"
description = "Local, read-only Yahoo Fantasy Basketball intelligence and offline draft MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastmcp>=3.0,<4", "httpx>=0.28,<1", "pydantic>=2.11,<3", "pydantic-settings>=2.8,<3", "defusedxml>=0.7,<1", "filelock>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.11", "mypy>=1.15", "types-defusedxml"]

[project.scripts]
fantasy-mcp = "fantasy_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["yahoo_live: requires explicit live Yahoo authorization"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

